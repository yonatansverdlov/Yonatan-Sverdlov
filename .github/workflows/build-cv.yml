name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - "cv.tex"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "CV PDF is already up to date."
          else
            git commit -m "Update generated CV PDF"
            git push
          fi
